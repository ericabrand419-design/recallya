<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recallya Lead Capture Demo</title><style>body{font-family:Inter,system-ui,sans-serif;background:#f4f7fb;color:#15233d;margin:0;padding:30px}.wrap{max-width:620px;margin:auto;background:#fff;border:1px solid #dfe7f1;border-radius:24px;padding:24px;box-shadow:0 20px 50px rgba(31,55,90,.08)}h1{margin:0 0 6px}p{color:#617086;line-height:1.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:5px;font-size:.78rem;font-weight:750}input,textarea,select{font:inherit;border:1px solid #d4deeb;border-radius:11px;padding:11px}.wide{grid-column:1/-1}textarea{min-height:100px}button{border:0;border-radius:12px;padding:12px 16px;background:#2b66f6;color:#fff;font-weight:800;cursor:pointer}.result{margin-top:15px;padding:12px;border-radius:12px;background:#eef5ff;display:none}@media(max-width:600px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head>
<body><main class="wrap"><small>RECALLYA DEMO</small><h1>Website lead intake</h1><p>This is the form behavior Recallya can accept from a website, ad landing page or referral form. Submit it and the lead is normalized for the CRM intake endpoint.</p><form id="f" class="grid"><label>Name<input name="name" required placeholder="Dana Mitchell"></label><label>Company<input name="company" placeholder="ABC Motors"></label><label>Email<input name="email" type="email" placeholder="dana@example.com"></label><label>Role<input name="role" placeholder="Service Director"></label><label>Source<select name="source"><option>Website form</option><option>Referral</option><option>Landing page</option></select></label><label>Estimated value<input name="value" type="number" min="0" placeholder="5000"></label><label class="wide">What are they interested in?<textarea name="context" placeholder="Interested in an Agent First pilot and asked about training time."></textarea></label><button class="wide">Send to Recallya</button></form><div class="result" id="r"></div></main><script>document.querySelector('#f').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const body=Object.fromEntries(f.entries());const workspaceSlug=new URLSearchParams(location.search).get('workspace_slug');if(workspaceSlug)body.workspace_slug=workspaceSlug;const r=document.querySelector('#r');r.style.display='block';r.textContent='Sending…';try{const x=await fetch('/api/leads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await x.json();if(x.ok){let q=[];try{q=JSON.parse(localStorage.getItem('recallya-inbound-leads')||'[]')}catch{}q.push({...body,workspaceId:body.workspace_slug||null});localStorage.setItem('recallya-inbound-leads',JSON.stringify(q));r.textContent=`Accepted: ${d.lead.name} · ${d.lead.source} · First action: ${d.first_action.title}. Open or refresh Recallya to see the relationship.`}else r.textContent=`Error: ${d.error||x.status}`;}catch(err){r.textContent='Could not reach the intake endpoint.'}}</script></body></html>
