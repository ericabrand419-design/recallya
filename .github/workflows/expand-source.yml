name: Expand Recallya source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  expand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand Recallya
        shell: bash
        run: |
          set -euo pipefail
          cat .deploy/part-*.b64 > /tmp/recallya.b64
          test "$(wc -c < /tmp/recallya.b64)" -eq 97576
          base64 -d /tmp/recallya.b64 > /tmp/recallya.zip
          unzip -t /tmp/recallya.zip
          rm -rf /tmp/recallya-src
          mkdir -p /tmp/recallya-src
          unzip -q /tmp/recallya.zip -d /tmp/recallya-src
          shopt -s dotglob
          cp -a /tmp/recallya-src/Recallya-2.2-Trust/* .
          rm -rf .deploy
      - name: Commit expanded source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Expand Recallya 2.2 source"
          git push
